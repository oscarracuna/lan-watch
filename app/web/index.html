<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Watch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/favicon.svg" alt="">
      <div>
        <h1>LAN Watch</h1>
        <p class="tagline">Live ICMP status on this network</p>
      </div>
      <span id="live" class="pill">Connecting</span>
    </div>
    <div id="summary" class="summary"></div>
    <div class="controls">
      <label class="search-wrap">
        <span class="sr-only">Filter hosts</span>
        <input id="search" type="search" placeholder="Filter gateways, terminals, or endpoints…" autocomplete="off">
      </label>
      <span id="sweep" class="sweep">Last sweep: —</span>
      <button id="btn-mute" type="button">Sound on</button>
      <button id="btn-notify" type="button">Enable notifications</button>
    </div>
  </header>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <section class="incidents" aria-label="Incidents">
    <div class="incidents-head">
      <h2>Incidents</h2>
      <span id="incident-count" class="hint"></span>
    </div>
    <div id="incidents" class="incident-list"></div>
  </section>

  <main id="grid" class="board"></main>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div>
        <h2 id="drawer-name">Host</h2>
        <p id="drawer-ip" class="mono"></p>
      </div>
      <button id="drawer-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="drawer-stats" class="drawer-stats"></div>
    <div id="spark" class="spark"></div>
    <p id="drawer-hint" class="hint"></p>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
