<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map · LAN Watch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=map2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body class="map-page">
  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/favicon.svg" alt="">
      <div>
        <h1>LAN Watch</h1>
        <p class="tagline">Gateway map · Ciudad Juárez</p>
      </div>
      <span id="live" class="pill">Connecting</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="/">Dashboard</a>
      <a href="/map" aria-current="page">Map</a>
    </nav>
  </header>

  <div class="map-layout">
    <aside class="map-side">
      <h2>Gateways</h2>
      <p class="hint">Place a site, then drag the pin. Positions are saved for this LAN Watch.</p>
      <div id="unplaced"></div>
      <div id="placed"></div>
    </aside>
    <div id="city-map" class="city-map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/map.js?v=map2"></script>
</body>
</html>
